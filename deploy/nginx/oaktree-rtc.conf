# LiveKit signalling — the SFU behind room huddles.
#
# TLS terminates here; the SFU itself binds 127.0.0.1 and is never reachable
# directly. Only the *signalling* passes through nginx. Media does not: it goes
# straight to udp/7882 and tcp/7881 on this host, which is why those two ports
# are open in the firewall and 7880 is not.
#
# A separate hostname rather than a path on hub.oaktreetech.com, for three
# reasons, the first of which is decisive:
#
#  1. The SFU is expected to outgrow the shared VM. When it does, moving it is
#     one A record and one env var (LIVEKIT_API_URL). Under a path on the main
#     host you would be rewriting nginx and re-testing the app's CSP as well.
#  2. /twirp — ListRooms, RemoveParticipant, DeleteRoom — is served on the same
#     port as signalling. Its own server block makes refusing that one path
#     trivial and independent of any app route.
#  3. /app and /apps on the main host already belong to Reverb.
#
# Install to /etc/nginx/sites-available/oaktree-rtc, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`. Certificate:
#   certbot --nginx -d rtc.oaktreetech.com

upstream oaktree_livekit {
    server 127.0.0.1:7880;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name rtc.oaktreetech.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rtc.oaktreetech.com;

    ssl_certificate     /etc/letsencrypt/live/rtc.oaktreetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtc.oaktreetech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # The admin API. The app reaches it over loopback; a browser never should.
    # A leaked join token is one huddle. A reachable /twirp is every huddle in
    # the company, plus the ability to end any of them.
    location /twirp {
        return 404;
    }

    # Everything else is LiveKit's signalling surface — /rtc, /rtc/validate, and
    # whatever a future client version adds. Proxying the remainder rather than
    # naming paths means a client-SDK upgrade needs no nginx change.
    location / {
        proxy_pass http://oaktree_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Signalling idles for the whole huddle. Same reasoning as the Reverb
        # location in oaktree-hub.conf: these connections must not be reaped, or
        # a quiet meeting drops after sixty seconds.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/oaktree-rtc.access.log;
    error_log  /var/log/nginx/oaktree-rtc.error.log;
}
