# Oak Tree Venture Hub — nginx site.
#
# Two upstreams behind one hostname: PHP-FPM for the app, and Reverb for the
# WebSocket. Keeping them on one origin avoids a CORS dance on the socket and
# means one certificate.
#
# Install to /etc/nginx/sites-available/oaktree-hub, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.

upstream oaktree_reverb {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.oaktreetech.com;

    # Everything is HTTPS. Sessions are marked secure in production, so the app
    # is not usable over plain HTTP anyway.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.oaktreetech.com;

    root /var/www/oaktree-hub/public;
    index index.php;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/hub.oaktreetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.oaktreetech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ------------------------------------------------------------ hardening
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # The app renders no user HTML, so this can stay tight. 'unsafe-inline' is
    # needed for Livewire's and Alpine's inline handlers.
    #
    # Two additions for 1:1 calling:
    #   media-src  ... blob:  — the remote MediaStream is attached to <audio>
    #                           and <video> elements.
    #   connect-src ... turn  — browsers do not currently enforce connect-src
    #                           against ICE server URLs, but the spec permits
    #                           it, and naming them costs nothing today.
    # connect-src carries wss://rtc.oaktreetech.com for the huddle SFU. Remove it
    # and huddles fail at the websocket handshake with nothing in the Laravel log
    # — the browser refuses the connection before LiveKit is ever reached.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://hub.oaktreetech.com wss://rtc.oaktreetech.com https://rtc.live.cloudflare.com stun:stun.cloudflare.com:3478 turn:turn.cloudflare.com:3478 turns:turn.cloudflare.com:5349; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Stated explicitly, and it must stay this way.
    #
    # An absent Permissions-Policy already defaults to a 'self' allowlist, so
    # this changes nothing today. It is here because the obvious "hardening"
    # edit — camera=(), microphone=() — silently breaks every call in the hub
    # with no error anywhere in the logs. Naming the intent is cheaper than
    # debugging that later.
    #
    # display-capture is here for the same reason: it gates getDisplayMedia(),
    # which is how screen sharing in a huddle works.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;

    server_tokens off;

    # Attachments are capped at 40 MB per file and 80 MB per message in
    # config/hub.php. Sized to the BATCH, not the single file: Livewire posts
    # every selected file in one request. The headroom above 80 MB is for the
    # multipart envelope, so an over-large upload gets the app's own validation
    # error rather than a bare 413 with nothing to explain it.
    client_max_body_size 88M;

    # Not optional at this size. The default is 60 seconds, and 40 MB over a
    # 5 Mbps office uplink takes longer than that — without this a large upload
    # fails on a timeout rather than on its size, which looks like a bug rather
    # than a limit.
    client_body_timeout 300s;

    # ------------------------------------------------------------- websocket
    # Reverb. The long read timeout is the point: these connections idle for
    # minutes between events and must not be reaped.
    location /app {
        proxy_pass http://oaktree_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Reverb's HTTP side: the app POSTs published events here.
    location /apps {
        proxy_pass http://oaktree_reverb;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------ app
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built assets are content-hashed by Vite, so they are safe to pin.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be cached, or a stale one keeps handling
    # push events after a deploy.
    location = /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # A 2,000-row CSV import is queued, not synchronous, so the request
        # itself stays short. This is headroom, not a target.
        #
        # Raised for attachments: AttachmentController streams downloads through
        # PHP-FPM, so a 40 MB file on a slow connection holds a worker for the
        # whole transfer and 120s would cut it off part-way. This is a mitigation,
        # not a fix — the fix is to stop sending bytes through PHP at all
        # (X-Accel-Redirect, or signed object-storage URLs once the S3 driver is
        # in use). Watch the worker pool if large attachments become common.
        fastcgi_read_timeout 300s;
    }

    # Nothing under a dot is ever served — .env, .git, editor droppings.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/oaktree-hub.access.log;
    error_log  /var/log/nginx/oaktree-hub.error.log;
}
