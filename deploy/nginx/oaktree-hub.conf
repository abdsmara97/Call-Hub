# Oak Tree Venture Hub — nginx site.
#
# Two upstreams behind one hostname: PHP-FPM for the app, and Reverb for the
# WebSocket. Keeping them on one origin avoids a CORS dance on the socket and
# means one certificate.
#
# Install to /etc/nginx/sites-available/oaktree-hub, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.

upstream oaktree_reverb {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.oaktreetech.com;

    # Everything is HTTPS. Sessions are marked secure in production, so the app
    # is not usable over plain HTTP anyway.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.oaktreetech.com;

    root /var/www/oaktree-hub/public;
    index index.php;

    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/hub.oaktreetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.oaktreetech.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ------------------------------------------------------------ hardening
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # The app renders no user HTML, so this can stay tight. 'unsafe-inline' is
    # needed for Livewire's and Alpine's inline handlers.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' wss://hub.oaktreetech.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    server_tokens off;

    # Attachments are capped at 10 MB in config/hub.php; leave headroom for the
    # multipart envelope so the app returns its own validation error rather than
    # nginx returning a bare 413.
    client_max_body_size 12M;

    # ------------------------------------------------------------- websocket
    # Reverb. The long read timeout is the point: these connections idle for
    # minutes between events and must not be reaped.
    location /app {
        proxy_pass http://oaktree_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Reverb's HTTP side: the app POSTs published events here.
    location /apps {
        proxy_pass http://oaktree_reverb;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------ app
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built assets are content-hashed by Vite, so they are safe to pin.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be cached, or a stale one keeps handling
    # push events after a deploy.
    location = /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # A 2,000-row CSV import is queued, not synchronous, so the request
        # itself stays short. This is headroom, not a target.
        fastcgi_read_timeout 120s;
    }

    # Nothing under a dot is ever served — .env, .git, editor droppings.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/oaktree-hub.access.log;
    error_log  /var/log/nginx/oaktree-hub.error.log;
}
