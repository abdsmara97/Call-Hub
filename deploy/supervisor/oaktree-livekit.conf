; LiveKit — the SFU that carries room huddles.
;
; Restarting this ENDS every live huddle instantly. Unlike a one-to-one call,
; whose media never touches this server and which therefore survives a Reverb
; restart, huddle media flows through this process. There is no drain that
; helps: participants are dropped and have to press Join again.
;
; That is why it is NOT in deploy/deploy.sh. Upgrade it by hand, out of hours,
; with deploy/livekit/install-livekit.sh.
;
; Install to /etc/supervisor/conf.d/oaktree-livekit.conf then:
;   supervisorctl reread && supervisorctl update && supervisorctl start oaktree-livekit
;
; numprocs is 1 and must stay 1. A second copy simply fails to bind the ports;
; genuine multi-node needs a Redis-backed LiveKit cluster and node-aware client
; redirects, which is a different deployment rather than a bigger number here.

[program:oaktree-livekit]
process_name=%(program_name)s
command=/usr/local/bin/livekit-server --config /etc/livekit/livekit.yaml
directory=/etc/livekit
; Its own user, not www-data. The SFU needs no access to the app tree, the
; attachment disks or the MySQL socket, and keeping it separate means a LiveKit
; vulnerability is not immediately an application compromise.
;   useradd --system --no-create-home livekit
user=livekit
autostart=true
autorestart=true
numprocs=1
; SIGINT is LiveKit's graceful stop: it stops accepting joins, then closes.
stopsignal=INT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/oaktree/livekit.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; This process shares CPU with PHP-FPM. Capping it at two cores means a busy
; huddle cannot starve web requests: thirty audio participants is roughly 40,000
; packets a second, and the softirq load that generates is what will make the hub
; feel slow long before anything shows up as "CPU usage".
;
; Remove the cap the day LiveKit gets its own box.
environment=GOMAXPROCS="2"

; NOTE: an SFU holds a socket per subscriber and needs far more file descriptors
; than the default 1024. The same [supervisord] minfds=10000 that
; oaktree-reverb.conf asks for covers this — children inherit the limit.
