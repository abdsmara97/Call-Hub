; Reverb — the WebSocket server behind every live update in the hub.
;
; If this process is down the app still works, but nothing is real time:
; messages need a refresh, and an emergency overlay never appears for a
; recipient who is looking at another room. Treat it as a tier-1 service and
; alert on it, not just on nginx and PHP-FPM.
;
; Install to /etc/supervisor/conf.d/oaktree-reverb.conf then:
;   supervisorctl reread && supervisorctl update && supervisorctl start oaktree-reverb
;
; numprocs is deliberately 1: Reverb holds connection state in memory, so a
; second process on the same port would serve half the subscribers a different
; view of who is present. Scale vertically first; beyond that, run Reverb with
; a Redis backend so instances share state.

[program:oaktree-reverb]
process_name=%(program_name)s
command=php /var/www/oaktree-hub/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/var/www/oaktree-hub
user=www-data
autostart=true
autorestart=true
numprocs=1
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/oaktree/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; NOTE: long-lived sockets need more file descriptors than the default 1024,
; and this single Reverb process now serves EVERY tenant — size the limit to
; the sum of all workspaces' accounts, not any one customer's. Raise it on the
; supervisor daemon itself, not per program:
;   /etc/supervisor/supervisord.conf  →  [supervisord] minfds=10000
; Child processes inherit the limit.
