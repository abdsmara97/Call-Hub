; Horizon — the queue worker fleet.
;
; Horizon supervises its own workers (see config/horizon.php, which defines
; separate emergency / default / imports supervisors). Supervisor's only job
; here is to keep the Horizon master process alive.
;
; Install to /etc/supervisor/conf.d/oaktree-horizon.conf then:
;   supervisorctl reread && supervisorctl update && supervisorctl start oaktree-horizon
;
; Deploys must run `php artisan horizon:terminate` AFTER the new code is in
; place. Horizon workers hold the old code in memory until they restart.

[program:oaktree-horizon]
process_name=%(program_name)s
command=php /var/www/oaktree-hub/artisan horizon
directory=/var/www/oaktree-hub
user=www-data
autostart=true
autorestart=true
; Horizon needs a moment to shut its workers down cleanly. SIGTERM, not SIGKILL:
; a killed worker mid-emergency-fanout leaves recipients un-notified.
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/oaktree/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
