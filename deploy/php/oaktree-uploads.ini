; PHP upload ceilings for the Oak Tree Venture Hub.
;
; Drop in at /etc/php/8.2/fpm/conf.d/99-oaktree-uploads.ini and also at
; /etc/php/8.2/cli/conf.d/ if anything uploads from the console, then:
;
;   sudo systemctl reload php8.2-fpm
;
; These exist because PHP's own defaults (upload_max_filesize 2M,
; post_max_size 8M) sit far below what the app advertises, and they win. A hub
; configured for 40 MB attachments silently refuses anything over 2 MB until
; this file is in place — and worse, when post_max_size is exceeded PHP discards
; the whole request body, so Laravel sees an empty request and cannot even say
; "file too large". The user gets an unexplained failure.
;
; Four ceilings have to agree. The lowest one always wins:
;
;   HUB_ATTACHMENT_MAX_KB            .env                     40 MB per file
;   temporary_file_upload.rules      config/livewire.php      reads the same var
;   client_max_body_size             deploy/nginx/...conf     88M
;   upload_max_filesize              here                     40M
;
; tests/Feature/Hub/AttachmentLimitTest.php guards the two the app can see.
; These two it cannot, which is why they are written down.

; One file, matching HUB_ATTACHMENT_MAX_KB=40960.
upload_max_filesize = 40M

; The whole request. Sized to HUB_ATTACHMENT_MAX_BATCH_KB=81920 plus envelope,
; because Livewire posts every selected file together rather than one at a time.
; Must stay at or above nginx's client_max_body_size or nginx will accept a
; request PHP then throws away.
post_max_size = 88M

; Uploads stream to a temporary file rather than being buffered in memory, so
; this does not need to track the sizes above. It is here so the value is
; deliberate rather than inherited.
memory_limit = 256M

; A 40 MB upload over a slow office uplink takes minutes. These must clear the
; same bar as nginx's client_body_timeout, or the request dies mid-transfer and
; reads as a bug rather than a limit.
max_execution_time = 300
max_input_time = 300

; Well above the five files the composer permits; left at the PHP default so a
; per-request array cannot be used to exhaust file descriptors.
max_file_uploads = 20
